<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рация</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #14171f;
    --panel2: #1e2430;
    --border: #242a37;
    --text: #e8ebf2;
    --muted: #8a93a7;
    --accent: #ff8a3d;
    --record: #ff3b3b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    height: 100dvh;
  }

  /* ===== Сайдбар ===== */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 20px 16px;
    gap: 20px;
    overflow-y: auto;
  }
  .brand {
    font-size: 18px; font-weight: 700; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
  }
  .brand span { color: var(--accent); }

  .section-label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted);
    font-weight: 600; margin-bottom: 8px;
  }

  .user-block input {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .user-block input:focus { border-color: var(--accent); }

  .channels { display: flex; flex-direction: column; gap: 4px; }
  .channel {
    display: flex; align-items: center; gap: 8px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: background .15s, color .15s;
    width: 100%;
  }
  .channel:hover { background: var(--panel2); color: var(--text); }
  .channel.active {
    background: rgba(255,138,61,.12);
    color: var(--accent);
  }
  .channel .emoji { font-size: 16px; flex: 0 0 auto; }
  .ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lock { font-size: 11px; opacity: .55; flex: 0 0 auto; }
  .ch-count {
    background: rgba(255,255,255,.06);
    color: var(--muted);
    font-size: 11px; font-weight: 700;
    padding: 2px 7px;
    border-radius: 8px;
    min-width: 22px;
    text-align: center;
    line-height: 1.4;
    flex: 0 0 auto;
    transition: background .15s, color .15s;
  }
  .ch-count.zero { opacity: .4; }
  .channel.active .ch-count {
    background: rgba(255,138,61,.22);
    color: var(--accent);
    opacity: 1;
  }

  .online { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #userList { list-style: none; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .user-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .user-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4a5365; flex: 0 0 auto;
    transition: background .15s, box-shadow .15s;
  }
  .user-item.talking .dot {
    background: var(--record);
    box-shadow: 0 0 10px var(--record);
    animation: blink .8s ease-in-out infinite;
  }
  .user-item.talking { color: var(--text); }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: .35; }
  }
  .uname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== Основная область ===== */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: 0 0 auto;
  }
  .ch-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .ch-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(255,138,61,.7);
  }
  .top-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
  #status { display: flex; align-items: center; gap: 6px; }
  #status::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #4a5365;
  }
  #status.online::before { background: #34d17a; box-shadow: 0 0 8px #34d17a; }
  #status.offline::before { background: #ff5555; box-shadow: 0 0 8px #ff5555; }
  #status.rec::before { background: var(--record); box-shadow: 0 0 8px var(--record); animation: blink .8s infinite; }

  /* ===== Кнопка PTT ===== */
  .ptt-area {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px 20px;
  }
  #ptt {
    position: relative;
    width: 170px; height: 170px;
    border-radius: 50%;
    border: 1px solid #2e3646;
    background: radial-gradient(circle at 32% 28%, #3a4356, #1a1f2a 70%);
    color: #e8ebf2;
    font-family: inherit;
    font-size: 15px; font-weight: 700; letter-spacing: 1.5px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    box-shadow:
      0 16px 32px rgba(0,0,0,.55),
      inset 0 -5px 14px rgba(0,0,0,.6),
      inset 0 2px 4px rgba(255,255,255,.06);
    transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  .ptt-icon { font-size: 32px; filter: grayscale(.3); transition: filter .2s; }
  #ptt:hover:not(:disabled) { border-color: #3c4658; }
  #ptt.active {
    background: radial-gradient(circle at 32% 28%, #ff6a5c, #b81f1f 70%);
    color: #fff; border-color: #ff6a5c;
    transform: scale(.95);
    box-shadow:
      0 0 60px rgba(255,59,59,.55),
      inset 0 -5px 14px rgba(0,0,0,.4);
  }
  #ptt.active .ptt-icon { filter: grayscale(0); }
  #ptt.active::after {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(255,80,80,.75);
    animation: ring 1.2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes ring {
    0% { transform: scale(1); opacity: .9; }
    100% { transform: scale(1.22); opacity: 0; }
  }
  #ptt:disabled { opacity: .45; cursor: not-allowed; }
  #ptt:disabled::after { display: none; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  /* ===== Чат ===== */
  .chat {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    min-height: 0;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .messages {
    flex: 1 1 auto; overflow-y: auto;
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 8px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }

  .msg {
    max-width: 75%;
    padding: 8px 13px;
    border-radius: 14px;
    font-size: 14px; line-height: 1.4;
    word-wrap: break-word; overflow-wrap: anywhere;
    animation: msgIn .18s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: none; }
  }
  .msg.other {
    align-self: flex-start;
    background: var(--panel2);
    border-bottom-left-radius: 5px;
  }
  .msg.own {
    align-self: flex-end;
    background: linear-gradient(135deg, #ff9a4d, #ff6a2b);
    color: #26140a;
    border-bottom-right-radius: 5px;
    font-weight: 500;
  }
  .msg .meta {
    font-size: 11px; font-weight: 700;
    opacity: .8; margin-bottom: 2px;
    display: flex; gap: 6px; align-items: baseline;
  }
  .msg .meta .time { font-weight: 400; opacity: .7; }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 12px; padding: 2px 8px;
    font-style: italic; max-width: 90%; text-align: center;
  }

  .chat-form {
    flex: 0 0 auto;
    display: flex; gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  .chat-form input {
    flex: 1; min-width: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .chat-form input:focus { border-color: var(--accent); }
  .chat-form button {
    flex: 0 0 auto;
    background: var(--accent);
    color: #241000;
    border: none;
    width: 46px; height: 46px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-form button:hover { filter: brightness(1.1); }
  .chat-form button:active { transform: scale(.94); }

  /* ===== Модальное окно пароля ===== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn .15s;
  }
  .modal-backdrop[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 24px 20px;
    width: 100%; max-width: 340px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    animation: pop .18s ease-out;
    text-align: center;
  }
  @keyframes pop {
    from { transform: scale(.94); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-icon { font-size: 34px; margin-bottom: 10px; }
  .modal h3 { font-size: 17px; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .modal input {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;   /* 16px — иначе iOS зумит страницу */
    text-align: center;
    letter-spacing: 3px;
    outline: none;
    transition: border-color .15s;
  }
  .modal input:focus { border-color: var(--accent); }
  .pw-error {
    min-height: 18px;
    color: #ff6b6b;
    font-size: 12px;
    margin-top: 8px;
  }
  .modal-btns { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: none;
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #241000; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: #252b38; }

  /* ===== Мобильная версия ===== */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

    .sidebar {
      flex-direction: row; align-items: center;
      padding: 10px 12px; gap: 10px;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; overflow-y: hidden;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .brand, .online, .section-label { display: none; }

    .user-block { flex: 0 0 auto; width: 110px; }
    .user-block input { padding: 8px 10px; font-size: 13px; }

    .channels { flex-direction: row; gap: 6px; flex: 0 0 auto; }
    .channel {
      padding: 8px 10px; font-size: 13px;
      background: var(--panel2);
      border: 1px solid var(--border);
      width: auto;
      gap: 6px;
    }
    .channel .emoji { font-size: 14px; }
    .channel.active { border-color: var(--accent); }
    .ch-count { padding: 1px 6px; min-width: 18px; }

    .topbar { padding: 10px 14px; }
    .top-right { gap: 10px; font-size: 12px; }
    #onlineBadge { display: none; }

    .ptt-area { padding: 14px 12px; gap: 8px; }
    #ptt { width: 118px; height: 118px; font-size: 12px; letter-spacing: 1px; }
    .ptt-icon { font-size: 22px; }
    .hint { font-size: 11px; }

    .messages { padding: 12px 14px; }
    .msg { max-width: 85%; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">🎙️ <span>Рация</span></div>

    <div class="user-block">
      <div class="section-label">Ваше имя</div>
      <input id="nameInput" maxlength="24" placeholder="Имя" autocomplete="off">
    </div>

    <div>
      <div class="section-label">Каналы</div>
      <div class="channels" id="channels">
        <button class="channel" data-ch="general">
          <span class="emoji">📡</span>
          <span class="ch-name">Общий</span>
          <span class="ch-count" data-count>0</span>
        </button>
        <button class="channel" data-ch="alpha">
          <span class="emoji">🅰️</span>
          <span class="ch-name">Альфа</span>
          <span class="lock" data-lock>🔒</span>
          <span class="ch-count" data-count>0</span>
        </button>
        <button class="channel" data-ch="bravo">
          <span class="emoji">🅱️</span>
          <span class="ch-name">Браво</span>
          <span class="lock" data-lock>🔒</span>
          <span class="ch-count" data-count>0</span>
        </button>
        <button class="channel" data-ch="charlie">
          <span class="emoji">🎯</span>
          <span class="ch-name">Чарли</span>
          <span class="lock" data-lock>🔒</span>
          <span class="ch-count" data-count>0</span>
        </button>
      </div>
    </div>

    <div class="online">
      <div class="section-label">В эфире · <span id="onlineCount">0</span></div>
      <ul id="userList"></ul>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="ch-info">
        <span class="ch-dot"></span>
        <span id="channelName">Общий</span>
      </div>
      <div class="top-right">
        <span id="onlineBadge">0 в эфире</span>
        <span id="status">Соединение...</span>
      </div>
    </header>

    <section class="ptt-area">
      <button id="ptt" disabled>
        <span class="ptt-icon">🎙️</span>
        <span class="ptt-text">СОЕДИНЕНИЕ</span>
      </button>
      <div class="hint">Зажмите кнопку или пробел, чтобы говорить</div>
    </section>

    <section class="chat">
      <div class="messages" id="messages"></div>
      <form class="chat-form" id="chatForm">
        <input id="chatInput" placeholder="Написать сообщение..." maxlength="500" autocomplete="off">
        <button type="submit" aria-label="Отправить">➤</button>
      </form>
    </section>
  </main>
</div>

<!-- Модальное окно для пароля -->
<div class="modal-backdrop" id="pwModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-icon">🔒</div>
    <h3 id="pwTitle">Канал защищён</h3>
    <p id="pwSubtitle">Введите пароль для входа в канал</p>
    <input type="password" id="pwInput" placeholder="••••" maxlength="20" inputmode="numeric" autocomplete="off">
    <div class="pw-error" id="pwError"></div>
    <div class="modal-btns">
      <button type="button" id="pwCancel" class="btn btn-ghost">Отмена</button>
      <button type="button" id="pwSubmit" class="btn btn-primary">Войти</button>
    </div>
  </div>
</div>

<script>
const SAMPLE_RATE = 16000;
const CHANNELS = {
  general: { name: 'Общий',  locked: false },
  alpha:   { name: 'Альфа',  locked: true  },
  bravo:   { name: 'Браво',  locked: true  },
  charlie: { name: 'Чарли',  locked: true  }
};

// Элементы
const $ptt        = document.getElementById('ptt');
const $status     = document.getElementById('status');
const $messages   = document.getElementById('messages');
const $chatForm   = document.getElementById('chatForm');
const $chatInput  = document.getElementById('chatInput');
const $nameInput  = document.getElementById('nameInput');
const $userList   = document.getElementById('userList');
const $onlineCount= document.getElementById('onlineCount');
const $onlineBadge= document.getElementById('onlineBadge');
const $channelName= document.getElementById('channelName');
const $pwModal    = document.getElementById('pwModal');
const $pwTitle    = document.getElementById('pwTitle');
const $pwSubtitle = document.getElementById('pwSubtitle');
const $pwInput    = document.getElementById('pwInput');
const $pwError    = document.getElementById('pwError');
const $pwCancel   = document.getElementById('pwCancel');
const $pwSubmit   = document.getElementById('pwSubmit');

// Состояние
let ws, audioCtx, processor;
let talking = false;
let nextPlayTime = 0;
let currentChannel = 'general';
let users = [];
let talkingUsers = new Set();
const chatHistory = {};

let pendingChannel = null;   // канал, для которого спрашиваем пароль
let pendingPassword = null;  // пароль, отправленный на сервер

// Сохранённые пароли каналов (уже проверенные). Храним в localStorage
let channelPasswords = {};
try { channelPasswords = JSON.parse(localStorage.getItem('walkie-pw') || '{}') || {}; } catch {}
function savePasswords() {
  try { localStorage.setItem('walkie-pw', JSON.stringify(channelPasswords)); } catch {}
}

// ===== Имя =====
let myName = localStorage.getItem('walkie-name');
if (!myName) {
  myName = 'Гость-' + Math.floor(100 + Math.random() * 900);
  localStorage.setItem('walkie-name', myName);
}
$nameInput.value = myName;

$nameInput.addEventListener('change', () => {
  const v = $nameInput.value.trim().slice(0, 24);
  if (!v) { $nameInput.value = myName; return; }
  myName = v;
  localStorage.setItem('walkie-name', myName);
  sendJoin(currentChannel, channelPasswords[currentChannel]);
});

// ===== Инициализация =====
async function init() {
  updateLocks();
  applyChannelUI(currentChannel);
  connectWs();

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
    const mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    const src = audioCtx.createMediaStreamSource(mic);
    processor = audioCtx.createScriptProcessor(2048, 1, 1);
    src.connect(processor);

    const mute = audioCtx.createGain();
    mute.gain.value = 0;
    processor.connect(mute);
    mute.connect(audioCtx.destination);

    processor.onaudioprocess = onAudio;
  } catch (err) {
    setStatus('Нет микрофона — только чат', 'offline');
  }
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    // Пробуем войти в текущий канал (используем сохранённый пароль, если есть)
    sendJoin(currentChannel, channelPasswords[currentChannel]);
    $ptt.disabled = false;
    setStatus('Онлайн', 'online');
  };

  ws.onclose = () => {
    $ptt.disabled = true;
    setStatus('Переподключение...', 'offline');
    talking = false;
    $ptt.classList.remove('active');
    $ptt.querySelector('.ptt-text').textContent = 'ОФФЛАЙН';
    setTimeout(connectWs, 2000);
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      handleServerMessage(msg);
    } else {
      playAudio(e.data);
    }
  };
}

function setStatus(text, cls) {
  $status.textContent = text;
  $status.className = cls || '';
}

function sendJoin(channel, password) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const payload = { type: 'join', channel, name: myName };
  if (password) payload.password = password;
  ws.send(JSON.stringify(payload));
}

// ===== Сообщения от сервера =====
function handleServerMessage(msg) {
  switch (msg.type) {

    case 'joined': {
      // Если ждали подтверждения по конкретному каналу — сохраняем пароль
      if (pendingChannel === msg.channel && pendingPassword) {
        channelPasswords[msg.channel] = pendingPassword;
        savePasswords();
        updateLocks();
      }
      pendingChannel = null;
      pendingPassword = null;
      closeModal();
      applyChannelUI(msg.channel);
      $ptt.querySelector('.ptt-text').textContent = 'ГОВОРИТЬ';
      break;
    }

    case 'join-denied': {
      if (!$pwModal.hidden && pendingChannel === msg.channel) {
        // Ошибка в модальном окне
        if (msg.reason === 'wrong-password') {
          $pwError.textContent = 'Неверный пароль';
        } else {
          $pwError.textContent = 'Канал недоступен';
        }
        $pwInput.select();
      } else if (msg.channel === currentChannel) {
        // Автоподключение упало (например, пароль сменили) — падаем в Общий
        delete channelPasswords[msg.channel];
        savePasswords();
        updateLocks();
        currentChannel = 'general';
        sendJoin('general');
      }
      break;
    }

    case 'channel-counts':
      updateChannelCounts(msg.counts);
      break;

    case 'chat':
      addMessage(currentChannel, {
        kind: msg.from === myName ? 'own' : 'other',
        from: msg.from,
        text: msg.text,
        time: msg.time
      });
      break;

    case 'system':
      addMessage(currentChannel, { kind:'system', text: msg.text, time: Date.now() });
      break;

    case 'users':
      users = msg.list;
      renderUsers();
      break;

    case 'talk':
      if (msg.on) talkingUsers.add(msg.name);
      else talkingUsers.delete(msg.name);
      renderUsers();
      break;
  }
}

// ===== Счётчики каналов =====
function updateChannelCounts(counts) {
  document.querySelectorAll('.channel').forEach(btn => {
    const ch = btn.dataset.ch;
    const el = btn.querySelector('[data-count]');
    if (!el) return;
    const n = counts[ch] || 0;
    el.textContent = n;
    el.classList.toggle('zero', n === 0);
  });
}

// ===== Применение UI канала =====
function applyChannelUI(ch) {
  currentChannel = ch;
  document.querySelectorAll('.channel').forEach(b => {
    b.classList.toggle('active', b.dataset.ch === ch);
  });
  $channelName.textContent = CHANNELS[ch].name;

  // Сброс индикаторов, пока сервер не пришлёт новые
  talkingUsers.clear();
  users = [];
  renderUsers();
  renderChannelMessages();
}

// ===== Замки на каналах =====
function updateLocks() {
  document.querySelectorAll('.channel').forEach(b => {
    const ch = b.dataset.ch;
    const lock = b.querySelector('[data-lock]');
    if (!lock) return;
    // Показываем замок, если канал защищён и пароль ещё не введён
    if (CHANNELS[ch].locked && !channelPasswords[ch]) lock.hidden = false;
    else lock.hidden = true;
  });
}

// ===== Модальное окно пароля =====
function openPasswordModal(ch) {
  pendingChannel = ch;
  pendingPassword = null;
  $pwTitle.textContent = 'Канал защищён';
  $pwSubtitle.textContent = `Введите пароль для входа в канал «${CHANNELS[ch].name}»`;
  $pwError.textContent = '';
  $pwInput.value = '';
  $pwModal.hidden = false;
  setTimeout(() => $pwInput.focus(), 60);
}

function closeModal() {
  $pwModal.hidden = true;
  $pwError.textContent = '';
  $pwInput.value = '';
}

function submitPassword() {
  if (!pendingChannel) return;
  const pw = $pwInput.value.trim();
  if (!pw) { $pwError.textContent = 'Введите пароль'; return; }
  pendingPassword = pw;
  $pwError.textContent = '';
  sendJoin(pendingChannel, pw);
}

$pwSubmit.addEventListener('click', submitPassword);
$pwInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitPassword(); }
});
$pwCancel.addEventListener('click', () => {
  pendingChannel = null;
  pendingPassword = null;
  closeModal();
});
$pwModal.addEventListener('click', (e) => {
  if (e.target === $pwModal) {
    pendingChannel = null;
    pendingPassword = null;
    closeModal();
  }
});

// ===== Клик по каналу =====
document.getElementById('channels').addEventListener('click', (e) => {
  const btn = e.target.closest('.channel');
  if (!btn) return;
  const ch = btn.dataset.ch;
  if (ch === currentChannel) return;

  const info = CHANNELS[ch];
  if (info.locked && !channelPasswords[ch]) {
    openPasswordModal(ch);
    return;
  }
  sendJoin(ch, channelPasswords[ch]);
});

// ===== Сообщения чата =====
function addMessage(channel, message) {
  if (!chatHistory[channel]) chatHistory[channel] = [];
  chatHistory[channel].push(message);
  if (channel === currentChannel) {
    renderMessage(message);
    scrollToBottom();
  }
}

function renderMessage(m) {
  const el = document.createElement('div');
  if (m.kind === 'system') {
    el.className = 'msg system';
    el.textContent = m.text;
  } else {
    el.className = 'msg ' + m.kind;
    if (m.kind === 'other') {
      el.innerHTML =
        `<div class="meta">${escapeHtml(m.from)}<span class="time">${fmtTime(m.time)}</span></div>` +
        `<div>${escapeHtml(m.text)}</div>`;
    } else {
      el.innerHTML =
        `<div class="meta"><span class="time">${fmtTime(m.time)}</span></div>` +
        `<div>${escapeHtml(m.text)}</div>`;
    }
  }
  $messages.appendChild(el);
}

function renderChannelMessages() {
  $messages.innerHTML = '';
  const list = chatHistory[currentChannel] || [];
  for (const m of list) renderMessage(m);
  scrollToBottom();
}

function scrollToBottom() { $messages.scrollTop = $messages.scrollHeight; }

function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

// ===== Список участников =====
function renderUsers() {
  $userList.innerHTML = '';
  for (const name of users) {
    const li = document.createElement('li');
    li.className = 'user-item' + (talkingUsers.has(name) ? ' talking' : '');
    li.innerHTML = `<span class="dot"></span><span class="uname">${escapeHtml(name)}</span>`;
    $userList.appendChild(li);
  }
  $onlineCount.textContent = users.length;
  $onlineBadge.textContent = users.length + ' в эфире';
}

// ===== Аудио: отправка =====
function onAudio(e) {
  if (!talking || !ws || ws.readyState !== WebSocket.OPEN) return;
  const input = e.inputBuffer.getChannelData(0);
  const pcm = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  ws.send(pcm.buffer);
}

// ===== Аудио: воспроизведение =====
function playAudio(arrayBuffer) {
  if (!audioCtx) return;
  const int16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 0x8000;

  const buffer = audioCtx.createBuffer(1, float32.length, SAMPLE_RATE);
  buffer.copyToChannel(float32, 0);

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (nextPlayTime < now + 0.05) nextPlayTime = now + 0.05;
  src.start(nextPlayTime);
  nextPlayTime += buffer.duration;
}

// ===== PTT =====
function startTalk(e) {
  e?.preventDefault();
  if ($ptt.disabled) return;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (talking) return;
  talking = true;
  $ptt.classList.add('active');
  setStatus('Передача...', 'rec');
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type:'talk', on: true }));
  }
}

function stopTalk(e) {
  e?.preventDefault();
  if (!talking) return;
  talking = false;
  $ptt.classList.remove('active');
  setStatus('Онлайн', 'online');
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type:'talk', on: false }));
  }
}

$ptt.addEventListener('mousedown', startTalk);
$ptt.addEventListener('mouseup', stopTalk);
$ptt.addEventListener('mouseleave', stopTalk);
$ptt.addEventListener('touchstart', startTalk, { passive: false });
$ptt.addEventListener('touchend', stopTalk);
$ptt.addEventListener('touchcancel', stopTalk);
$ptt.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && document.activeElement !== $chatInput && document.activeElement !== $nameInput) {
    startTalk(e);
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') stopTalk(e);
});

// ===== Чат =====
$chatForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $chatInput.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type:'chat', text }));
  $chatInput.value = '';
});

// ===== Старт =====
init();
</script>
</body>
</html>
